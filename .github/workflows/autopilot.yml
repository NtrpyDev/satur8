name: autopilot

# Keeps Satur8 maintained without a human in the loop.
#
#   scan      (no AI)        works out what needs doing this run
#   triage    (Opus)         sorts each new issue: minor, major, needs-noah, skip
#   fix       (Opus/Fable)   writes the fix for a sorted issue and opens a pull request
#   followup  (Opus/Fable)   corrects a fix whose tests failed or that got review findings
#   land      (Opus + no AI) last safety check, then merges onto main
#   release   (no AI)        ships the merged fixes as a new patch version
#
# How far it goes is set by the repository variable AUTOPILOT_STAGE:
#   1 sort only   2 also fix and follow up   3 also merge   4 also release
#
# It runs on a timer, not on issue events, on purpose: an issue event is
# attributed to whoever opened the issue, and Claude only runs for people with
# write access. A timed run is attributed to the maintainer, and the stranger's
# text is handed to Claude as a file to evaluate, never as instructions.
#
# Claude never touches git or GitHub. It edits files in the checkout and returns
# a structured report; .github/autopilot/steps.py decides what happens next.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      release_now:
        description: "Release waiting fixes now instead of batching them"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: autopilot
  cancel-in-progress: false

env:
  STAGE: ${{ vars.AUTOPILOT_STAGE || '1' }}

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      triage: ${{ steps.scan.outputs.triage }}
      has_triage: ${{ steps.scan.outputs.has_triage }}
      fix: ${{ steps.scan.outputs.fix }}
      has_fix: ${{ steps.scan.outputs.has_fix }}
      followup: ${{ steps.scan.outputs.followup }}
      has_followup: ${{ steps.scan.outputs.has_followup }}
      land: ${{ steps.scan.outputs.land }}
      has_land: ${{ steps.scan.outputs.has_land }}
      release: ${{ steps.scan.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: stage
        run: echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Make sure the autopilot labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make() { gh label create "$1" --color "$2" --description "$3" --force >/dev/null; }
          make "autopilot"            "5319e7" "Opened or managed by the autopilot"
          make "autopilot:minor"      "0e8a16" "Sorted as a contained fix (Opus)"
          make "autopilot:major"      "b60205" "Sorted as a far-reaching fix (Fable)"
          make "autopilot:needs-noah" "fbca04" "Needs a decision from the maintainer"
          make "autopilot:skip"       "cfd3d7" "The autopilot leaves this alone"
          make "autopilot:working"    "1d76db" "A fix is in progress"
          make "autopilot:round-1"    "c5def5" "One follow-up round used"
          make "autopilot:round-2"    "c5def5" "Two follow-up rounds used"

      - name: Work out what needs doing
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/autopilot/scan.py

      - name: Hand over fixes that used up their follow-up rounds
        if: steps.scan.outputs.has_exhausted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXHAUSTED: ${{ steps.scan.outputs.exhausted }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          for item in json.loads(os.environ["EXHAUSTED"]):
              env = dict(os.environ, PULL=str(item["number"]),
                         WHY="it still fails after two follow-up rounds")
              match = re.fullmatch(r"autopilot/issue-(\d+)", item["branch"])
              if match:
                  env["ISSUE"] = match.group(1)
              subprocess.run(["python3", ".github/autopilot/steps.py", "park"], env=env, check=True)
          PY

  triage:
    name: sort issue #${{ matrix.item.number }}
    needs: scan
    if: needs.scan.outputs.has_triage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJSON(needs.scan.outputs.triage) }}
    steps:
      - uses: actions/checkout@v4

      - name: Save the issue as a file for Claude to read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ matrix.item.number }}
        run: python3 .github/autopilot/steps.py issue-file

      - name: Ask Claude for a verdict
        id: verdict
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow the instructions in .github/autopilot/prompts/triage.md exactly.
            The issue to sort is in .autopilot-input/issue.md.
          claude_args: |
            --model claude-opus-5-5
            --permission-mode default
            --max-turns 30
            --allowedTools "Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"severity":{"type":"string","enum":["minor","major","needs-noah","skip","unsafe"]},"kind":{"type":"string"},"summary":{"type":"string"},"reason":{"type":"string"}},"required":["severity","summary","reason"]}'

      - name: Apply the verdict as a label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ matrix.item.number }}
          VERDICT: ${{ steps.verdict.outputs.structured_output }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          try:
              verdict = json.loads(os.environ.get("VERDICT") or "{}")
          except ValueError:
              verdict = {}
          severity = verdict.get("severity", "")
          label = {
              "minor": "autopilot:minor",
              "major": "autopilot:major",
              "skip": "autopilot:skip",
          }.get(severity, "autopilot:needs-noah")
          number = os.environ["NUMBER"]
          subprocess.run(
              ["gh", "issue", "edit", number, "--add-label", label],
              check=True, stdout=subprocess.DEVNULL,
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"### Issue #{number} sorted as `{severity or 'no verdict'}`\n")
              if verdict:
                  out.write(f"- What is wrong: {verdict.get('summary', 'n/a')}\n")
                  out.write(f"- Why this label: {verdict.get('reason', 'n/a')}\n")
              else:
                  out.write("- Claude returned no verdict, so the issue was handed to the maintainer.\n")
          PY

  fix:
    name: fix issue #${{ matrix.item.number }} (${{ matrix.item.severity }})
    needs: scan
    if: needs.scan.outputs.has_fix == 'true' && fromJSON(needs.scan.outputs.stage) >= 2
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        item: ${{ fromJSON(needs.scan.outputs.fix) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUMBER: ${{ matrix.item.number }}
      SEVERITY: ${{ matrix.item.severity }}
      BRANCH: autopilot/issue-${{ matrix.item.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start a branch for the fix
        run: git switch -c "$BRANCH"

      - name: Save the issue as a file for Claude to read
        run: python3 .github/autopilot/steps.py issue-file

      - name: Prepare the container the fix is tested in
        run: .github/autopilot/dev-container.sh

      - name: Have Claude write and test the fix
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow the instructions in .github/autopilot/prompts/fix.md exactly.
            The issue to fix is in .autopilot-input/issue.md.
          claude_args: |
            --model ${{ matrix.item.severity == 'major' && 'claude-fable-5-2' || 'claude-opus-5-5' }}
            --permission-mode acceptEdits
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(/opt/autopilot/check.sh:*),Bash(cargo fmt:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"fixed":{"type":"boolean"},"summary":{"type":"string"},"changelog":{"type":"string"},"tests":{"type":"string"},"needs_human":{"type":"boolean"},"note":{"type":"string"}},"required":["fixed","summary","changelog","tests","needs_human"]}'

      - name: Commit the fix and open the pull request
        if: always()
        env:
          MODE: fix
          REPORT: ${{ steps.claude.outputs.structured_output }}
        run: python3 .github/autopilot/steps.py finish

  followup:
    name: follow up on pull request #${{ matrix.item.number }} (${{ matrix.item.reason }})
    needs: [scan, fix]
    if: always() && needs.scan.outputs.has_followup == 'true' && fromJSON(needs.scan.outputs.stage) >= 2
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        item: ${{ fromJSON(needs.scan.outputs.followup) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUMBER: ${{ matrix.item.number }}
      SEVERITY: ${{ matrix.item.severity }}
      BRANCH: ${{ matrix.item.branch }}
      REASON: ${{ matrix.item.reason }}
      ROUNDS: ${{ matrix.item.rounds }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.item.branch }}
          fetch-depth: 0

      - name: Collect the failing output or the review findings
        run: python3 .github/autopilot/steps.py feedback

      - name: Prepare the container the fix is tested in
        run: .github/autopilot/dev-container.sh

      - name: Have Claude correct the fix
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow the instructions in .github/autopilot/prompts/followup.md exactly.
            The feedback is in .autopilot-input/feedback.md.
          claude_args: |
            --model ${{ matrix.item.severity == 'major' && 'claude-fable-5-2' || 'claude-opus-5-5' }}
            --permission-mode acceptEdits
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(/opt/autopilot/check.sh:*),Bash(cargo fmt:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"fixed":{"type":"boolean"},"summary":{"type":"string"},"changelog":{"type":"string"},"tests":{"type":"string"},"needs_human":{"type":"boolean"},"note":{"type":"string"}},"required":["fixed","summary","changelog","tests","needs_human"]}'

      - name: Commit the correction and test it again
        if: always()
        env:
          MODE: followup
          REPORT: ${{ steps.claude.outputs.structured_output }}
        run: python3 .github/autopilot/steps.py finish

  land:
    name: check and merge pull request #${{ matrix.item.number }}
    needs: [scan, followup]
    if: always() && needs.scan.outputs.has_land == 'true' && fromJSON(needs.scan.outputs.stage) >= 3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        item: ${{ fromJSON(needs.scan.outputs.land) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUMBER: ${{ matrix.item.number }}
      BRANCH: ${{ matrix.item.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save the change and its report as files for Claude to read
        run: |
          git fetch -q origin "$BRANCH:refs/remotes/origin/$BRANCH"
          mkdir -p .autopilot-input
          git diff "origin/main...origin/$BRANCH" > .autopilot-input/change.diff
          issue="${BRANCH#autopilot/issue-}"
          if [ "$issue" != "$BRANCH" ]; then NUMBER="$issue" python3 .github/autopilot/steps.py issue-file; fi

      - name: Last safety check before merging
        id: gate
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow the instructions in .github/autopilot/prompts/gate.md exactly.
            The change is in .autopilot-input/change.diff and the report is in .autopilot-input/issue.md.
          claude_args: |
            --model claude-opus-5-5
            --permission-mode default
            --max-turns 40
            --allowedTools "Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"safe":{"type":"boolean"},"fixes_issue":{"type":"boolean"},"tested":{"type":"boolean"},"reason":{"type":"string"}},"required":["safe","fixes_issue","tested","reason"]}'

      - name: Merge it, or hand it to the maintainer
        if: always()
        env:
          VERDICT: ${{ steps.gate.outputs.structured_output }}
        run: |
          verdict="$(python3 - <<'PY'
          import json, os
          try:
              v = json.loads(os.environ.get("VERDICT") or "{}")
          except ValueError:
              v = {}
          ok = v.get("safe") is True and v.get("fixes_issue") is True and v.get("tested") is True
          print("pass" if ok else "hold: " + " ".join(str(v.get("reason") or "the safety check returned no verdict").split())[:300])
          PY
          )"
          echo "### Safety check for pull request #$NUMBER: $verdict" >> "$GITHUB_STEP_SUMMARY"
          rm -rf .autopilot-input
          if [ "$verdict" = "pass" ]; then
            python3 .github/autopilot/steps.py land
          else
            issue="${BRANCH#autopilot/issue-}"; [ "$issue" != "$BRANCH" ] || issue=""
            ISSUE="$issue" PULL="$NUMBER" WHY="${verdict#hold: }" python3 .github/autopilot/steps.py park
          fi

  release:
    name: release waiting fixes
    needs: [scan, land]
    if: always() && fromJSON(needs.scan.outputs.stage) >= 4 && (needs.scan.outputs.release == 'true' || needs.land.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cut the version if fixes are waiting
        id: cut
        env:
          AUTOPILOT_RELEASE_NOW: ${{ inputs.release_now && 'true' || 'false' }}
        run: python3 .github/autopilot/release.py

      - name: Build and publish the release files
        if: steps.cut.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main -f tag="${{ steps.cut.outputs.tag }}"
