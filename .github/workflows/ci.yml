name: ci

# The ground truth for every change: does Satur8 still build, pass its tests,
# build the KWin effects, and install? No AI here. Runs on pull requests from
# anyone, including forks, and needs no secrets. The release tarball is built
# and tested by build-tarball.yml, and the Decky plugin ZIP by
# build-decky-plugin.yml, the same workflows release.yml uses.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, test, package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in a Fedora container
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/work" \
            -w /work \
            fedora:latest \
            bash -lc '
              set -euo pipefail
              dnf -y install dnf-plugins-core rpm-build git tar gzip rustfmt clippy >/tmp/dnf-base.log
              dnf -y builddep packaging/satur8.spec >/tmp/dnf-builddep.log
              git config --global --add safe.directory /work
              echo "::group::format check"
              cargo fmt --all --check
              echo "::endgroup::"
              echo "::group::lint"
              cargo clippy --workspace --all-targets --locked
              echo "::endgroup::"
              echo "::group::tests"
              cargo test --workspace --locked
              echo "::endgroup::"
              chown -R "$HOST_UID:$HOST_GID" target
            '

  tarball:
    name: release tarball
    uses: ./.github/workflows/build-tarball.yml

  decky-plugin:
    name: decky plugin
    uses: ./.github/workflows/build-decky-plugin.yml
