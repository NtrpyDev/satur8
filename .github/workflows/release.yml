name: release

# On a version tag, build the release artifacts reproducibly and attach them to
# the GitHub release for that tag. The source archive is the trust anchor: it is
# deterministic and is what the Arch (PKGBUILD) and Fedora (spec) packaging fetch
# and checksum. The Linux binary tarball is the convenience download the website
# serves, built from portable parts by build-tarball.yml. The Decky plugin ZIP
# (decky-plugin/) is built by build-decky-plugin.yml and attached beside them.
#
# A run started by hand with dry_run set builds and tests everything and
# publishes nothing: every step that attaches files to a release, and the
# COPR build, is skipped by an `if:` on that input. That is how the pipeline
# is tested from a branch. For a dry run, `tag` may name a branch.

on:
  push:
    tags:
      - "v*"
  # The autopilot starts releases this way: a tag pushed by a workflow does not
  # trigger other workflows, so it names the tag here instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v0.3.6 (a branch is fine for a dry run)"
        required: true
        type: string
      dry_run:
        description: "Build and test only: attach nothing to any release and queue no COPR build"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  source-archive:
    name: source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build source archive and checksum
        run: packaging/source-tarball.sh

      - name: Extract release notes from CHANGELOG
        run: |
          mkdir -p target/dist
          packaging/release-notes.sh "${TAG}" > target/dist/release-notes.md
          echo "--- release notes ---"
          cat target/dist/release-notes.md

      - name: Attach to release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Satur8 ${{ env.TAG }}
          body_path: target/dist/release-notes.md
          files: |
            target/dist/satur8-v*-source.tar.gz
            target/dist/satur8-v*-source.tar.gz.sha256

  linux-x86_64:
    name: linux-x86_64 tarball
    # Builds and tests the tarball; publishes nothing.
    permissions:
      contents: read
    uses: ./.github/workflows/build-tarball.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  linux-x86_64-attach:
    name: linux-x86_64 tarball attach
    # After source-archive, so the release already has its title and notes
    # set; this job only attaches the binary tarball and leaves the body intact.
    needs: [source-archive, linux-x86_64]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.linux-x86_64.outputs.artifact }}
          path: target/dist

      - name: Check the tarball against its checksum
        run: |
          cd target/dist
          sha256sum -c satur8-v*-linux-x86_64.tar.gz.sha256

      # A copy under a name with no version in it, so the website's download
      # button can point at "the latest release" and never needs redeploying.
      - name: Add version-less copies for the website
        run: |
          cd target/dist
          cp satur8-v*-linux-x86_64.tar.gz satur8-linux-x86_64.tar.gz
          sha256sum satur8-linux-x86_64.tar.gz > satur8-linux-x86_64.tar.gz.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            target/dist/satur8-v*-linux-x86_64.tar.gz
            target/dist/satur8-v*-linux-x86_64.tar.gz.sha256
            target/dist/satur8-linux-x86_64.tar.gz
            target/dist/satur8-linux-x86_64.tar.gz.sha256

  decky-plugin:
    name: decky plugin
    # Builds and tests the plugin ZIP; publishes nothing.
    permissions:
      contents: read
    uses: ./.github/workflows/build-decky-plugin.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  decky-plugin-attach:
    name: decky plugin attach
    # After source-archive, so the release already has its title and notes.
    # satur8-decky-plugin.zip must stay the only .zip on the release: DeckyHub
    # lists a plugin whose release has exactly one plugin ZIP, so no second
    # copy under a versioned name and no other .zip file is attached anywhere
    # in this workflow.
    needs: [source-archive, decky-plugin]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.decky-plugin.outputs.artifact }}
          path: target/dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: target/dist/satur8-decky-plugin.zip

  fedora-copr:
    name: Fedora COPR build
    # After the source archive exists on the release, since the spec downloads it.
    needs: source-archive
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
    steps:
      - name: Queue the COPR build
        if: env.COPR_CONFIG != ''
        run: |
          pipx install copr-cli >/dev/null
          mkdir -p ~/.config && printf '%s\n' "$COPR_CONFIG" > ~/.config/copr && chmod 600 ~/.config/copr
          copr-cli buildscm --clone-url "https://github.com/${GITHUB_REPOSITORY}.git" \
            --commit "$TAG" --method make_srpm --nowait ntrpydev/satur8
