# Satur8: let KWin find a per-user build of the saturation effect.
#
# KWin only loads an effect plugin built for its exact version, so Satur8
# rebuilds the effect in your home directory after a KWin update. This adds
# that directory to the Qt plugin search path, ahead of the system one.
QT_PLUGIN_PATH=${HOME}/.local/lib/qt6/plugins${QT_PLUGIN_PATH:+:${QT_PLUGIN_PATH}}
